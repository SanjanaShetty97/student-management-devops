<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-btn {
      background: #28a745;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .add-btn:hover {
      background: #218838;
    }

    .student {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Student Management</h1>

  <input type="text" id="name" placeholder="Enter Name" />
  <input type="email" id="email" placeholder="Enter Email" />

  <button class="add-btn" onclick="addStudent()">Add Student</button>

  <h3>Students</h3>
  <div id="studentList"></div>
</div>

<script>
  // 🔥 CHANGE THIS AFTER DEPLOYING BACKEND
  const API = "https://student-management-p0a2.onrender.com/api/students";

  async function fetchStudents() {
    try {
      const res = await fetch(API);
      const data = await res.json();

      const list = document.getElementById("studentList");
      list.innerHTML = "";

      if (data.length === 0) {
        list.innerHTML = "<p>No students found.</p>";
        return;
      }

      data.forEach(student => {
        const div = document.createElement("div");
        div.className = "student";

        div.innerHTML = `
          <span>${student.name} (${student.email})</span>
          <button class="delete-btn" onclick="deleteStudent('${student._id}')">Delete</button>
        `;

        list.appendChild(div);
      });

    } catch (err) {
      console.error(err);
    }
  }

  async function addStudent() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    if (!name || !email) {
      alert("Please enter all fields");
      return;
    }

    await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, email })
    });

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";

    fetchStudents();
  }

  async function deleteStudent(id) {
    await fetch(`${API}/${id}`, {
      method: "DELETE"
    });

    fetchStudents();
  }

  // Load students on page load
  fetchStudents();
</script>

</body>
</html>
